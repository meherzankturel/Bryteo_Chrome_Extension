<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>bryteo</title>
    <script>
      (function() {
        try {
          var s = localStorage.getItem('bryteo.theme');
          if (s === 'dark' || s === 'light') document.documentElement.dataset.theme = s;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-screen">
    <div id="root" class="h-full"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
